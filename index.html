<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#EFF8F3"><title>숲속친구들 키우기</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script><script type="module" src="forest-music.js"></script><style>
.forest-music{position:fixed;z-index:21;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));min-height:36px;padding:4px 9px;border:1px solid #a69665;border-radius:20px;background:#183126;color:#f7ebc6;font-size:12px;white-space:nowrap}
.forest-music[aria-pressed=true]{background:#3b4930;color:#fff0af}
.forest-music:focus-visible{outline:2px solid #ffe69b;outline-offset:2px}
.quiz-page .mast,.care-page .mast{padding-top:42px}
.play-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px auto}
.play-controls button{padding:8px 12px;min-height:44px;word-break:keep-all}
.play-prop{position:absolute;z-index:4;top:62%;left:50%;font-size:clamp(25px,8vw,40px);pointer-events:none;animation:toy-twinkle 1s ease-out both}
.play-toy.friend-0 .play-prop{animation:roll-cone 2.2s ease-out both}
.play-toy.friend-1 .play-prop{top:30%;left:72%;transform-origin:top center;animation:ring-bell 2.2s ease-in-out both}
.play-toy.friend-2 .play-prop{animation:drift-leaf 2.2s ease-out both}
@keyframes toy-twinkle{0%{transform:translate(-100%,60%) scale(.6);opacity:0}35%{transform:translate(-50%,-35%) scale(1.12);opacity:1}100%{transform:translate(-50%,-60%);opacity:0}}
@keyframes roll-cone{0%{transform:translateX(-38vw) rotate(-200deg);opacity:0}18%{opacity:1}75%{transform:translateX(-50%) rotate(10deg);opacity:1}100%{transform:translateX(-50%);opacity:0}}
@keyframes ring-bell{20%,60%{transform:rotate(-22deg)}40%,80%{transform:rotate(19deg)}100%{opacity:0}}
@keyframes drift-leaf{0%{transform:translate(-38vw,-140%) rotate(-35deg);opacity:0}22%{opacity:1}68%{transform:translate(36%,-32%) rotate(115deg);opacity:1}100%{transform:translate(85%,15%) rotate(145deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.friend-play .pet,.friend-play .play-prop{animation:none!important}.play-prop{transform:translateX(-50%)}}
.friend-play .pet .play-pose{animation:none}
.ornament-touch{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;border:0;background:transparent;pointer-events:auto;cursor:pointer}
.ornament-touch:hover,.ornament-touch:focus-visible{background:#ffe8a51a;outline:1px solid #ffe9ab;border-radius:12px}
.forest-slot-0>.ornament-touch,.forest-slot-4>.ornament-touch{inset:0 auto auto 1%;width:21%;height:24%}
.forest-slot-4>.ornament-touch{inset:0 0 auto auto}
.forest-slot-5>.ornament-touch{inset:0 22%;width:56%}
.ornament-active .gear-art{animation:ornament-shine 1.7s ease both}
@keyframes ornament-shine{25%,70%{filter:brightness(1.35) drop-shadow(0 0 7px #ffe9ae)}}
@media(prefers-reduced-motion:reduce){.ornament-active .gear-art{animation:none;filter:brightness(1.22)}}
.intro-video{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#10231a;z-index:1;transform:scale(1.035)}
.intro-video-playing .intro-video{display:block}
html:has(.forest-intro[open]),body:has(.forest-intro[open]){overflow:hidden;overscroll-behavior:none}
.forest-intro{touch-action:none;overscroll-behavior:none}
@keyframes intro-resist{0%,100%{transform:scale(1.035)}42%{transform:translateY(var(--intro-push)) scale(1.05)}70%{transform:translateY(calc(var(--intro-push) * -.18)) scale(1.035)}}
.intro-video.intro-bounce{animation:intro-resist 340ms cubic-bezier(.2,.75,.25,1)}
.intro-sound{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));padding:8px 15px;background:#10231aeb;color:#fff9e9;border:1px solid #ffe69b88}
.intro-sound[hidden]{display:none}
.forest-piece .ornament-touch::before{content:"";position:absolute;inset:-12%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(ellipse,var(--ornament-halo,#ffd479b0),transparent 69%)}
.gear-1{--ornament-halo:#d9cbffbd}
.gear-2{--ornament-halo:#ffb16cbd}
.show-ornament-hints .forest-piece .ornament-touch::before{animation:ornament-hint 950ms ease-out both;animation-delay:var(--hint-delay,0ms)}
.show-ornament-hints .forest-piece:nth-child(2){--hint-delay:150ms}
.show-ornament-hints .forest-piece:nth-child(3){--hint-delay:300ms}
.show-ornament-hints .forest-piece:nth-child(4){--hint-delay:450ms}
.show-ornament-hints .forest-piece:nth-child(5){--hint-delay:600ms}
.show-ornament-hints .forest-piece:nth-child(6){--hint-delay:750ms}
.ornament-active .ornament-touch::before{animation:ornament-hint 1.3s ease-out both}
@keyframes ornament-hint{0%,100%{opacity:0;transform:scale(.88)}38%{opacity:.85;transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){.show-ornament-hints .forest-piece .ornament-touch::before,.ornament-active .ornament-touch::before{animation:none;opacity:.38}}
.care-page .habitat-0,.opening-0 .opening-forest{background:linear-gradient(#16291916,#10291a44),url('ornaments/habitat-0.webp') center 61%/cover}
.care-page .habitat-1,.opening-1 .opening-forest{background:linear-gradient(#1919310f,#111a3144),url('ornaments/habitat-1.webp') center 61%/cover}
.care-page .habitat-2,.opening-2 .opening-forest{background:linear-gradient(#40251b12,#35221842),url('ornaments/habitat-2.webp') center 61%/cover}
.forest-set .forest-slot-0>.forest-prop,.forest-set .forest-slot-4>.forest-prop{position:absolute;inset:1% auto auto 2%;width:17%;height:24%;object-position:center}
.forest-set .forest-slot-4>.forest-prop{inset:0 1% auto auto;width:18%;height:27%}
.forest-set .forest-slot-5>.forest-prop{object-position:center}
.forest-set .forest-slot-5.new-ornament{height:27%}
.forest-set .new-ornament.ornament-active>.forest-prop{animation:ornament-awake 1.7s ease both}
@keyframes ornament-awake{22%,68%{filter:brightness(1.28) drop-shadow(0 0 8px #ffdf9c);transform:translateY(-4%) rotate(-3deg)}46%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.forest-set .new-ornament.ornament-active>.forest-prop{animation:none}}
.forest-set .forest-slot-0.new-ornament>:is(.forest-prop,.ornament-touch){top:34%;height:31%;width:18%}
.forest-set .forest-slot-4.new-ornament>:is(.forest-prop,.ornament-touch){top:31%;height:37%;width:21%}
.forest-set.gear-2 .forest-slot-0.new-ornament>:is(.forest-prop,.ornament-touch){top:12%;height:30%}
.grove-scene .gear-2 .forest-slot-0:not(.new-ornament){inset:auto 6% 4% auto;width:21%;height:23%;z-index:3;background:none;opacity:1}
.grove-scene .gear-2 .forest-slot-0:not(.new-ornament)>:is(.forest-prop,.ornament-touch){inset:0;width:100%;height:100%}
.grove-scene .gear-2 .forest-slot-0:not(.new-ornament)>.forest-prop{object-position:center bottom;filter:drop-shadow(0 4px 4px #26191180)}
.grove-scene .mature-pet.stage-0>.friend-image{width:72%;height:72%}
.grove-scene .mature-pet.stage-1>.friend-image{width:80%;height:80%}
.grove-scene .mature-pet.stage-2>.friend-image{width:87%;height:87%}
.grove-scene .mature-pet.stage-3>.friend-image{width:93%;height:93%}
.grove-scene .mature-pet:is(.stage-0,.stage-1,.stage-2,.stage-3)>.friend-image{inset:auto 0 0;margin-inline:auto}
@media(prefers-reduced-motion:no-preference){.mature-pet.pose-feeding .friend-image{animation:growth-chew .32s ease-in-out 3}}
@keyframes growth-chew{45%{transform:scale(1.03,.95)}}
</style></head>
<body><button class="forest-music" type="button" aria-label="숲 배경 음악" aria-pressed="false" hidden><span aria-hidden="true">♫</span> <span>음악 꺼짐</span></button><header class="mast"><div class="mast-creator"><span aria-hidden="true">✦</span> 사자대장</div><div class="brand">숲속친구들 키우기</div><p>문제를 풀고 먹이를 얻어 친구를 키워요!</p></header><main id="app"></main><dialog id="forest-intro" class="forest-intro" aria-labelledby="forest-intro-title">
  <video class="intro-video" muted playsinline preload="none" aria-hidden="true"></video>
  <div class="intro-canopy" aria-hidden="true"></div>
  <div class="intro-path" aria-hidden="true"></div><div class="intro-foreground" aria-hidden="true"></div>
  <div class="intro-fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="intro-runner intro-runner-lion" aria-hidden="true"><div class="intro-ground-shadow"></div><div class="intro-stride"><img class="stride stride-0" data-src="run-lion-0.png" alt=""><img class="stride stride-1" data-src="run-lion-1.png" alt=""><img class="stride stride-2" data-src="run-lion-2.png" alt=""><img class="stride stride-3" data-src="run-lion-3.png" alt=""></div></div>
  <div class="intro-runner intro-runner-rabbit" aria-hidden="true"><div class="intro-ground-shadow"></div><div class="intro-stride"><img class="stride stride-0" data-src="run-rabbit-0.png" alt=""><img class="stride stride-1" data-src="run-rabbit-1.png" alt=""><img class="stride stride-2" data-src="run-rabbit-2.png" alt=""><img class="stride stride-3" data-src="run-rabbit-3.png" alt=""></div></div>
  <div class="intro-runner intro-runner-fox" aria-hidden="true"><div class="intro-ground-shadow"></div><div class="intro-stride"><img class="stride stride-0" data-src="run-fox-0.png" alt=""><img class="stride stride-1" data-src="run-fox-1.png" alt=""><img class="stride stride-2" data-src="run-fox-2.png" alt=""><img class="stride stride-3" data-src="run-fox-3.png" alt=""></div></div>
  <div class="intro-end"><p>✦ 사자대장</p><h2 id="forest-intro-title">숲속친구들 키우기</h2></div>
  <button class="intro-sound" type="button" hidden>🔊 소리 켜기</button>
  <button class="intro-skip" type="button" autofocus>건너뛰기 <span aria-hidden="true">›</span></button>
</dialog>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="fox-portrait-matte"><feComponentTransfer><feFuncA type="linear" slope="1.1435" intercept="-.1435"/></feComponentTransfer></filter></defs></svg>
</body></html>
